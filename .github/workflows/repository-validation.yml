name: Repository validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Project 77 repository baseline
        run: python Tools/validate_repository.py

      - name: Test P0 batch reporting tools
        run: python -m unittest discover -s Tools/tests -p "test_*.py"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Compile and smoke-test pure puzzle domains
        run: dotnet run --project Tools/DomainSmoke/Project77.DomainSmoke.csproj --configuration Release

      - name: Compile Unity-facing runtime scripts with API stubs
        run: dotnet build Tools/UnityScriptSmoke/Project77.UnityScriptSmoke.csproj --configuration Release

      - name: Compile Unity editor/build scripts with API stubs
        run: dotnet build Tools/EditorScriptSmoke/Project77.EditorScriptSmoke.csproj --configuration Release
