name: Repository validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Project 77 repository baseline
        run: python Tools/validate_repository.py

      - name: Test P0 operational tools
        run: python -m unittest discover -s Tools/tests -p "test_*.py"

      - name: Smoke-test P1 batch freeze tools
        run: |
          python Tools/p1_freeze_manifest.py generate \
            --batch-id CI-P1-SMOKE \
            --orientation portrait \
            --device-target "CI Android device | API 29 | 1080x2340 | portrait" \
            --help-threshold-seconds 30 \
            --allow-unbound-artifact \
            --output /tmp/project77-p1-freeze.json
          python Tools/p1_freeze_manifest.py verify /tmp/project77-p1-freeze.json

      - name: Emit exact P1-001 repository freeze snapshot
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, "Tools")
          import p1_freeze_manifest as freeze
          commit = "357356a9fdf34052cc666bf6ac16abec9e419848"
          manifest = freeze.build_manifest(
              "P1-001",
              commit,
              "0.0.1-prototype+357356a9fdf3",
              "2026-09-10T08:16:10Z",
              test_plan=freeze.build_test_plan(
                  "portrait",
                  ["Joy 4 | Android 10 / VOS 3.0 | 1080x2340 | portrait"],
                  30,
              ),
              root=Path("."),
              artifact_path=None,
          )
          print("P1_001_FREEZE_JSON=" + json.dumps(manifest, sort_keys=True, separators=(",", ":")))
          PY

      - name: Smoke-test P0 batch setup tools
        run: |
          python Tools/p0_order_plan.py --participants 10 --prefix CI-P0 --output PlaytestData/ci/orders.csv --summary-json PlaytestData/ci/orders.json
          python Tools/p0_freeze_manifest.py generate --batch-id CI-SMOKE --order-plan PlaytestData/ci/orders.csv --allow-unbound-artifact --output PlaytestData/ci/freeze.json
          python Tools/p0_freeze_manifest.py verify PlaytestData/ci/freeze.json --order-plan PlaytestData/ci/orders.csv

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Compile and smoke-test pure puzzle domains
        run: dotnet run --project Tools/DomainSmoke/Project77.DomainSmoke.csproj --configuration Release

      - name: Compile Unity-facing runtime scripts with API stubs
        run: dotnet build Tools/UnityScriptSmoke/Project77.UnityScriptSmoke.csproj --configuration Release

      - name: Test responsive GUI scaling profiles
        run: dotnet run --project Tools/ResponsiveGuiSmoke/Project77.ResponsiveGuiSmoke.csproj --configuration Release

      - name: Compile Unity editor/build scripts with API stubs
        run: dotnet build Tools/EditorScriptSmoke/Project77.EditorScriptSmoke.csproj --configuration Release
